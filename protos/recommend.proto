syntax = "proto3";

package ai_service;

service CVRecommender {
  rpc AnalyzeCV (CVRequest) returns (CVResponse) {}
}

message CVRequest {
  string cv_text = 1;
}

message JobItem {
  int32 id = 1;
  string title = 2;
  string company = 3;
  string job_url = 4;
  string match_reason = 5;
}

message CVResponse {
  repeated JobItem recommended_jobs = 1;
}